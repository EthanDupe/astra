<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astra – Gallery</title>
  <meta name="description" content="A masonry gallery with a live colour-grading panel." />
  <meta name="theme-color" content="#0f111a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:site_name" content="Astra" />
  <meta property="og:title" content="Astra – Gallery" />
  <meta property="og:description" content="A masonry gallery with a live colour-grading panel." />
  <meta property="og:type" content="website" />

  <script>
    (function (d) {
      var r = d.documentElement;
      r.classList.remove("no-js");
      r.classList.add("js");
      try {
        r.setAttribute("data-theme", localStorage.getItem("astra-theme") === "light" ? "light" : "dark");
      } catch (e) {}
    })(document);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ---- Masonry grid ---- */
    .masonry {
      column-count: 3;
      column-gap: 22px;
    }

    @media (max-width: 1024px) { .masonry { column-count: 2; } }
    @media (max-width: 600px) { .masonry { column-count: 1; } }

    .shot {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0 0 22px;
      break-inside: avoid;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: var(--r-lg);
      background: var(--glass-bg);
      box-shadow: var(--glass-shadow);
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) ease,
        border-color var(--dur) ease;
    }

    .shot img {
      display: block;
      width: 100%;
      filter: grayscale(20%);
      transition: transform 0.6s var(--ease), filter var(--dur) ease;
    }

    .shot::after {
      content: "View";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 15, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity var(--dur) ease;
      pointer-events: none;
    }

    .shot:hover,
    .shot:focus-visible {
      transform: translateY(-8px);
      border-color: var(--nav-hover-bg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45), 0 0 20px rgba(99, 102, 241, 0.25);
    }

    .shot:hover img,
    .shot:focus-visible img {
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .shot:hover::after,
    .shot:focus-visible::after {
      opacity: 1;
    }

    /* ---- Lightbox ---- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1600;
      display: flex;
      background: var(--scrim);
      backdrop-filter: blur(30px) saturate(120%);
      -webkit-backdrop-filter: blur(30px) saturate(120%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur) var(--ease);
    }

    .lightbox.is-active {
      opacity: 1;
      pointer-events: auto;
    }

    .stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 40px;
    }

    .stage img {
      max-width: 100%;
      max-height: 100%;
      border-radius: var(--r-sm);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      transition: filter 0.1s linear;
    }

    .stage-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      background: var(--glass-bg-strong);
      color: var(--text-main);
      font-size: 1.5rem;
      line-height: 1;
      transition: background var(--dur-fast) ease, transform var(--dur-fast) ease;
    }

    .stage-nav:hover,
    .stage-nav:focus-visible {
      background: var(--nav-hover-bg);
      color: var(--nav-hover-text);
      transform: translateY(-50%) scale(1.08);
    }

    .stage-nav--prev { left: 16px; }
    .stage-nav--next { right: 16px; }

    .grade-panel {
      flex: 0 0 320px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 32px 28px;
      overflow-y: auto;
      background: var(--glass-bg-strong);
      border-left: 1px solid var(--glass-hairline);
    }

    .grade-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grade-head h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .slider {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .slider label span {
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 860px) {
      .lightbox { flex-direction: column; }
      .stage { padding: 20px; }
      .grade-panel {
        flex: 0 0 auto;
        gap: 18px;
        padding: 20px;
        border-left: none;
        border-top: 1px solid var(--glass-hairline);
      }
    }
  </style>
</head>
<body data-layout="scroll">

  <a class="skip-link" href="#main">Skip to content</a>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div data-astra-nav-mount></div>

  <main class="page page--wide" id="main">
    <h1 class="page-title">Gallery</h1>
    <p class="page-lead">Open any shot to grade it live. Arrow keys move between images, Esc closes.</p>

    <div class="masonry" id="masonry"></div>

    <p class="panic-hint">Press <span class="kbd">]</span> to leave instantly.</p>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="stage">
      <button type="button" class="stage-nav stage-nav--prev" id="prev-shot" aria-label="Previous image">‹</button>
      <img src="" alt="" id="stage-image" />
      <button type="button" class="stage-nav stage-nav--next" id="next-shot" aria-label="Next image">›</button>
    </div>

    <div class="grade-panel">
      <div class="grade-head">
        <h2>Colour grade</h2>
        <button type="button" class="close-btn" id="close-lightbox" aria-label="Close viewer">&times;</button>
      </div>

      <div class="slider">
        <label for="sl-bright">Brightness <span id="val-bright">100%</span></label>
        <input type="range" id="sl-bright" min="0" max="200" value="100" />
      </div>

      <div class="slider">
        <label for="sl-contrast">Contrast <span id="val-contrast">100%</span></label>
        <input type="range" id="sl-contrast" min="0" max="200" value="100" />
      </div>

      <div class="slider">
        <label for="sl-sat">Saturation <span id="val-sat">100%</span></label>
        <input type="range" id="sl-sat" min="0" max="200" value="100" />
      </div>

      <div class="slider">
        <label for="sl-sepia">Warmth <span id="val-sepia">0%</span></label>
        <input type="range" id="sl-sepia" min="0" max="100" value="0" />
      </div>

      <div class="slider">
        <label for="sl-blur">Blur <span id="val-blur">0px</span></label>
        <input type="range" id="sl-blur" min="0" max="20" value="0" />
      </div>

      <button type="button" class="btn btn--block" id="reset-grade" style="margin-top:auto">Reset grading</button>
    </div>
  </div>

  <script src="astra.js"></script>
  <script>
    (function () {
      /* Gallery contents — add an entry to show another shot. */
      var SHOTS = [
        { src: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=80", alt: "A parked sports car at dusk" },
        { src: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1200&q=80", alt: "Abstract neon light trails" },
        { src: "https://images.unsplash.com/photo-1618331835717-801e976710b2?auto=format&fit=crop&w=1200&q=80", alt: "A tidy desk setup lit in blue" },
        { src: "https://images.unsplash.com/photo-1517504734587-2890819debab?auto=format&fit=crop&w=1200&q=80", alt: "City skyline at night" },
        { src: "https://images.unsplash.com/photo-1542281286-9e0a16bb7366?auto=format&fit=crop&w=1200&q=80", alt: "A neon-lit street in the rain" },
        { src: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1200&q=80", alt: "Developers working at a shared desk" }
      ];

      var masonry = document.getElementById("masonry");
      var lightbox = document.getElementById("lightbox");
      var stageImage = document.getElementById("stage-image");
      var current = 0;
      var lastFocus = null;

      var sliders = {
        bright: { input: document.getElementById("sl-bright"), out: document.getElementById("val-bright"), unit: "%", base: 100 },
        contrast: { input: document.getElementById("sl-contrast"), out: document.getElementById("val-contrast"), unit: "%", base: 100 },
        sat: { input: document.getElementById("sl-sat"), out: document.getElementById("val-sat"), unit: "%", base: 100 },
        sepia: { input: document.getElementById("sl-sepia"), out: document.getElementById("val-sepia"), unit: "%", base: 0 },
        blur: { input: document.getElementById("sl-blur"), out: document.getElementById("val-blur"), unit: "px", base: 0 }
      };

      function applyGrade() {
        var v = {};
        Object.keys(sliders).forEach(function (key) {
          v[key] = sliders[key].input.value;
          sliders[key].out.textContent = v[key] + sliders[key].unit;
        });

        stageImage.style.filter =
          "brightness(" + v.bright + "%) contrast(" + v.contrast + "%) saturate(" + v.sat + "%) sepia(" +
          v.sepia + "%) blur(" + v.blur + "px)";
      }

      function resetGrade() {
        Object.keys(sliders).forEach(function (key) {
          sliders[key].input.value = sliders[key].base;
        });
        applyGrade();
      }

      function build() {
        SHOTS.forEach(function (shot, index) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "shot";
          btn.setAttribute("data-cursor", "precise");
          btn.setAttribute("aria-label", "Open: " + shot.alt);

          var img = document.createElement("img");
          img.src = shot.src;
          img.alt = shot.alt;
          img.loading = "lazy";
          btn.appendChild(img);

          btn.addEventListener("click", function () {
            open(index);
          });
          masonry.appendChild(btn);
        });
      }

      function render() {
        var shot = SHOTS[current];
        stageImage.src = shot.src;
        stageImage.alt = shot.alt;
      }

      function open(index) {
        current = index;
        lastFocus = document.activeElement;
        resetGrade();
        render();
        lightbox.classList.add("is-active");
        document.body.style.overflow = "hidden";
        document.getElementById("close-lightbox").focus();
      }

      function close() {
        lightbox.classList.remove("is-active");
        document.body.style.overflow = "";
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }

      function step(delta) {
        current = (current + delta + SHOTS.length) % SHOTS.length;
        resetGrade();
        render();
      }

      Object.keys(sliders).forEach(function (key) {
        sliders[key].input.addEventListener("input", applyGrade);
      });

      document.getElementById("reset-grade").addEventListener("click", resetGrade);
      document.getElementById("close-lightbox").addEventListener("click", close);
      document.getElementById("prev-shot").addEventListener("click", function () {
        step(-1);
      });
      document.getElementById("next-shot").addEventListener("click", function () {
        step(1);
      });

      /* Clicking the empty area around the image closes the viewer. */
      lightbox.addEventListener("click", function (e) {
        if (e.target.classList.contains("stage")) close();
      });

      document.addEventListener("keydown", function (e) {
        if (!lightbox.classList.contains("is-active")) return;

        if (e.key === "Escape") {
          close();
          return;
        }

        /* Arrow keys belong to whichever slider has focus — otherwise nudging
           brightness would also skip to the next photo. */
        if (document.activeElement && document.activeElement.closest(".grade-panel")) return;

        if (e.key === "ArrowLeft") step(-1);
        else if (e.key === "ArrowRight") step(1);
      });

      build();
      resetGrade();
    })();
  </script>
</body>
</html>
