<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astra – Weather</title>
  <meta name="description" content="Live NOAA severe-weather alerts on a dark map." />
  <meta name="theme-color" content="#0f111a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:site_name" content="Astra" />
  <meta property="og:title" content="Astra – Weather" />
  <meta property="og:description" content="Live NOAA severe-weather alerts on a dark map." />
  <meta property="og:type" content="website" />

  <script>
    (function (d) {
      var r = d.documentElement;
      r.classList.remove("no-js");
      r.classList.add("js");
      try {
        r.setAttribute("data-theme", localStorage.getItem("astra-theme") === "light" ? "light" : "dark");
      } catch (e) {}
    })(document);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    #map {
      width: 100vw;
      height: 100vh;
      background: #0f111a;
    }

    .weather-panel {
      position: absolute;
      top: 84px;
      left: 24px;
      z-index: 1000;
      width: 320px;
      max-height: calc(100vh - 108px);
      overflow-y: auto;
    }

    .weather-panel h1 {
      margin: 0;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--header-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-panel .subtitle {
      margin: 6px 0 22px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 2.6em;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(165, 180, 252, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(165, 180, 252, 0); }
      100% { box-shadow: 0 0 0 0 rgba(165, 180, 252, 0); }
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .legend-key {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* User position marker */
    .user-marker {
      border: 3px solid #ffffff;
      border-radius: 50%;
      background-color: var(--brand-500);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.8);
      animation: userPulse 2s infinite;
    }

    @keyframes userPulse {
      0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.6); }
      70% { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    /* Leaflet popups, restyled to match the rest of the site */
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--glass-bg-strong);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      box-shadow: var(--glass-shadow);
    }

    .leaflet-popup-content-wrapper {
      border-radius: var(--r-lg);
      font-family: inherit;
    }

    .leaflet-popup-content {
      margin: 18px;
      width: 250px !important;
    }

    .leaflet-container a.leaflet-popup-close-button {
      padding: 8px 8px 0 0;
      color: var(--text-muted);
    }

    .leaflet-container a.leaflet-popup-close-button:hover {
      color: var(--text-main);
    }

    .popup-tag {
      margin-bottom: 6px;
      color: var(--brand-300);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .popup-title {
      margin-bottom: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .popup-meta {
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 500;
    }

    .leaflet-control-attribution {
      background: var(--glass-bg-strong) !important;
      color: var(--text-muted) !important;
    }

    .leaflet-control-attribution a {
      color: var(--brand-300) !important;
    }

    /* Zoom buttons ship as plain white squares; bring them into the glass set. */
    .leaflet-bar {
      border: none !important;
      border-radius: var(--r-sm) !important;
      overflow: hidden;
      box-shadow: var(--glass-shadow) !important;
    }

    .leaflet-bar a,
    .leaflet-bar a:hover {
      width: 34px;
      height: 34px;
      line-height: 34px;
      background: var(--glass-bg-strong);
      border-bottom: 1px solid var(--glass-hairline);
      color: var(--text-main);
      font-weight: 700;
      transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    }

    .leaflet-bar a:last-child {
      border-bottom: none;
    }

    .leaflet-bar a:hover,
    .leaflet-bar a:focus-visible {
      background: var(--nav-hover-bg);
      color: var(--nav-hover-text);
    }

    @media (max-width: 768px) {
      .weather-panel {
        top: 64px;
        left: 12px;
        right: 12px;
        width: auto;
        padding: 20px;
        max-height: 46vh;
      }
    }
  </style>
</head>
<body data-layout="fixed" data-astra-stars="off">

  <div data-astra-nav-mount></div>

  <!-- native-cursor lets the map keep its own grab/pointer cursors -->
  <div id="map" class="native-cursor"></div>

  <section class="glass-panel weather-panel" id="weather-panel" aria-label="Weather alerts">
    <div class="eyebrow" style="margin-bottom:16px">
      <span class="pulse-dot" aria-hidden="true"></span>
      Live monitor
    </div>

    <h1>NOAA Feed</h1>
    <p class="subtitle" id="status-text" role="status" aria-live="polite">Loading active alerts…</p>

    <button type="button" class="btn btn--block" id="locate-btn" style="margin-bottom:22px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" />
      </svg>
      Locate me
    </button>

    <p class="section-label">Severity</p>
    <div class="legend-row"><span class="legend-key" style="background:#ff3b30">EXT</span><span>Extreme warning</span></div>
    <div class="legend-row"><span class="legend-key" style="background:#ff9500">SEV</span><span>Severe warning</span></div>
    <div class="legend-row"><span class="legend-key" style="background:#ffcc00;color:#1a1a2e">MOD</span><span>Moderate watch</span></div>
    <div class="legend-row" style="margin-bottom:0"><span class="legend-key" style="background:#34c759">MIN</span><span>Minor / advisory</span></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="astra.js"></script>
  <script>
    (function () {
      var status = document.getElementById("status-text");

      /* Leaflet comes from a CDN — say so plainly if it did not arrive rather
         than throwing and leaving a blank screen. */
      if (typeof L === "undefined") {
        status.textContent = "The map library could not be loaded. Check your connection and reload.";
        document.getElementById("locate-btn").disabled = true;
        return;
      }

      var map = L.map("map", { zoomControl: false, zoomSnap: 0, zoomDelta: 0.5 })
        .setView([39.8283, -98.5795], 4);

      var tiles = {
        dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        light: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"
      };

      var tileLayer = null;

      /* The basemap follows the site theme instead of being locked to dark. */
      function paintBasemap() {
        var url = Astra.theme.get() === "light" ? tiles.light : tiles.dark;
        if (tileLayer) map.removeLayer(tileLayer);
        tileLayer = L.tileLayer(url, {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap &copy; CARTO"
        }).addTo(map);
      }

      Astra.ready(function () {
        paintBasemap();
        document.addEventListener("astra:themechange", paintBasemap);
      });

      L.control.zoom({ position: "bottomright" }).addTo(map);

      /* ---------------------------------------------------- user location */

      document.getElementById("locate-btn").addEventListener("click", function () {
        if (!navigator.geolocation) {
          status.textContent = "This browser cannot share a location.";
          return;
        }

        status.textContent = "Requesting location…";

        navigator.geolocation.getCurrentPosition(
          function (position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            map.flyTo([lat, lon], 9, { duration: Astra.prefersReducedMotion() ? 0 : 2 });

            L.marker([lat, lon], {
              icon: L.divIcon({ className: "user-marker", iconSize: [20, 20], iconAnchor: [10, 10] })
            })
              .addTo(map)
              .bindPopup('<div class="popup-title" style="margin:0;text-align:center">You are here</div>')
              .openPopup();

            status.textContent = "Centred on your location.";
          },
          function () {
            status.textContent = "Location access denied.";
          },
          { timeout: 10000 }
        );
      });

      /* ------------------------------------------------------- NOAA feed */

      var SEVERITY_COLOURS = {
        Extreme: "#ff3b30",
        Severe: "#ff9500",
        Moderate: "#ffcc00",
        Minor: "#34c759"
      };

      function styleFor(feature) {
        var colour = SEVERITY_COLOURS[feature.properties.severity] || "#34c759";
        return { fillColor: colour, color: colour, weight: 1, fillOpacity: 0.4 };
      }

      function expiryText(iso) {
        if (!iso) return "No expiry given";
        var when = new Date(iso);
        if (isNaN(when.getTime())) return "No expiry given";
        return "Ends " + when.toLocaleString();
      }

      /* Popups are built with DOM nodes so alert text from the feed can never
         inject markup into the page. */
      function popupFor(properties) {
        var wrap = document.createElement("div");

        var tag = document.createElement("div");
        tag.className = "popup-tag";
        tag.textContent = (properties.severity || "Unknown") + " priority";

        var title = document.createElement("div");
        title.className = "popup-title";
        title.textContent = properties.event || "Weather alert";

        var meta = document.createElement("div");
        meta.className = "popup-meta";
        meta.textContent = [properties.areaDesc, expiryText(properties.expires)]
          .filter(Boolean)
          .join(" · ");

        wrap.appendChild(tag);
        wrap.appendChild(title);
        wrap.appendChild(meta);
        return wrap;
      }

      fetch("https://api.weather.gov/alerts/active?status=actual&message_type=alert,update")
        .then(function (response) {
          if (!response.ok) throw new Error("NOAA responded " + response.status);
          return response.json();
        })
        .then(function (data) {
          var features = (data.features || []).filter(function (f) {
            return f.geometry !== null;
          });

          if (!features.length) {
            status.textContent = "No active alerts right now.";
            return;
          }

          L.geoJSON(features, {
            style: styleFor,
            onEachFeature: function (feature, layer) {
              layer.bindPopup(popupFor(feature.properties));
            }
          }).addTo(map);

          status.textContent = features.length + " active alerts nationwide.";
        })
        .catch(function (error) {
          status.textContent = "Could not load the NOAA feed. " + error.message;
        });
    })();
  </script>
</body>
</html>
