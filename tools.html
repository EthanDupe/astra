<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astra – Tools</title>
  <meta name="description" content="Calculator, notepad, unit converter, tab cloaker and stealth window — all offline, all in one place." />
  <meta name="theme-color" content="#0f111a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:site_name" content="Astra" />
  <meta property="og:title" content="Astra – Tools" />
  <meta property="og:description" content="Calculator, notepad, unit converter, tab cloaker and stealth window." />
  <meta property="og:type" content="website" />

  <script>
    (function (d) {
      var r = d.documentElement;
      r.classList.remove("no-js");
      r.classList.add("js");
      try {
        r.setAttribute("data-theme", localStorage.getItem("astra-theme") === "light" ? "light" : "dark");
      } catch (e) {}
    })(document);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Page-specific: the panel each tool is rendered into. */
    .tool-panel {
      max-width: 620px;
      margin: 0 auto;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity var(--dur) ease, transform var(--dur) var(--ease);
    }

    .tool-panel.is-shown {
      opacity: 1;
      transform: translateY(0);
    }

    .tool {
      width: 100%;
    }

    .tool--narrow {
      max-width: 360px;
      margin: 0 auto;
    }

    /* Calculator */
    .calc-display {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 68px;
      margin-bottom: 1rem;
      padding: 12px 16px;
      overflow-x: auto;
      border: 1px solid var(--glass-border);
      border-radius: var(--r-sm);
      background: var(--field-bg);
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .calc-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-keys .btn {
      padding: 14px 0;
      font-size: 1.05rem;
    }

    /* Notepad */
    .notepad-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .char-count {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .convert-result {
      margin-top: 1.5rem;
      padding: 14px;
      border-radius: var(--r-sm);
      background: var(--accent-soft);
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
      min-height: 60px;
    }
  </style>
</head>
<body data-layout="scroll">

  <a class="skip-link" href="#main">Skip to content</a>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div data-astra-nav-mount></div>

  <main class="page" id="main">
    <h1 class="page-title">Tools</h1>
    <p class="page-lead">Small utilities that run entirely in your browser. Nothing is uploaded anywhere.</p>

    <div class="segmented" role="tablist" aria-label="Tools" id="tool-tabs">
      <button type="button" role="tab" id="tab-calculator" aria-controls="tool-panel" aria-selected="true">Calculator</button>
      <button type="button" role="tab" id="tab-notepad" aria-controls="tool-panel" aria-selected="false">Notepad</button>
      <button type="button" role="tab" id="tab-converter" aria-controls="tool-panel" aria-selected="false">Converter</button>
      <button type="button" role="tab" id="tab-cloaker" aria-controls="tool-panel" aria-selected="false">Tab Cloaker</button>
      <button type="button" role="tab" id="tab-stealth" aria-controls="tool-panel" aria-selected="false">Stealth Window</button>
    </div>

    <section class="glass-panel tool-panel" id="tool-panel" role="tabpanel" aria-live="polite"></section>

    <p class="panic-hint">Press <span class="kbd">]</span> to leave instantly.</p>
  </main>

  <script src="astra.js"></script>
  <script>
    (function () {
      var panel = document.getElementById("tool-panel");
      var tabs = Array.prototype.slice.call(document.querySelectorAll("#tool-tabs [role='tab']"));
      var activeTool = "calculator";
      /* Lets a tool unregister document-level listeners when you switch away. */
      var teardown = [];

      /* ---------------------------------------------------- tool templates */

      var templates = {
        calculator:
          '<div class="tool tool--narrow">' +
          '  <div class="calc-display" id="calc-display" role="status" aria-live="polite" aria-label="Calculator display">0</div>' +
          '  <div class="calc-keys" id="calc-keys"></div>' +
          "</div>",

        notepad:
          '<div class="tool">' +
          '  <label class="field-label" for="notepad">Scratch pad</label>' +
          '  <textarea id="notepad" class="textarea" placeholder="Type your notes here — they are saved in this browser only."></textarea>' +
          '  <div class="notepad-meta">' +
          '    <button type="button" class="btn btn--primary" id="note-save">Save now</button>' +
          '    <span class="char-count" id="note-count">0 characters</span>' +
          "  </div>" +
          "</div>",

        converter:
          '<div class="tool tool--narrow">' +
          '  <div class="field">' +
          '    <label class="field-label" for="conv-type">Measurement</label>' +
          '    <select id="conv-type" class="select">' +
          '      <option value="length">Length</option>' +
          '      <option value="mass">Mass</option>' +
          '      <option value="temperature">Temperature</option>' +
          '      <option value="data">Data</option>' +
          "    </select>" +
          "  </div>" +
          '  <div class="field">' +
          '    <label class="field-label" for="conv-value">Value</label>' +
          '    <input type="number" step="any" id="conv-value" class="input" placeholder="Enter a value" />' +
          "  </div>" +
          '  <div class="field">' +
          '    <label class="field-label" for="conv-from">From</label>' +
          '    <select id="conv-from" class="select"></select>' +
          "  </div>" +
          '  <div class="field">' +
          '    <label class="field-label" for="conv-to">To</label>' +
          '    <select id="conv-to" class="select"></select>' +
          "  </div>" +
          '  <div class="convert-result" id="conv-result" role="status" aria-live="polite"></div>' +
          "</div>",

        cloaker:
          '<div class="tool tool--narrow">' +
          '  <div class="field">' +
          '    <label class="field-label" for="cloak-title">Tab title</label>' +
          '    <input type="text" id="cloak-title" class="input" placeholder="e.g. Google Classroom" />' +
          "  </div>" +
          '  <div class="field">' +
          '    <label class="field-label" for="cloak-favicon">Favicon URL (optional)</label>' +
          '    <input type="url" id="cloak-favicon" class="input" placeholder="https://…" />' +
          "  </div>" +
          '  <div class="row row--wrap">' +
          '    <button type="button" class="btn btn--primary" id="cloak-apply" style="flex:1">Apply</button>' +
          '    <button type="button" class="btn" id="cloak-reset" style="flex:1">Reset</button>' +
          "  </div>" +
          '  <p class="form-note" style="margin-top:14px">' +
          "    Presets live on the Apps page. Whatever you set here follows you around the site until you reset it." +
          "  </p>" +
          "</div>",

        stealth:
          '<div class="tool tool--narrow">' +
          '  <div class="field">' +
          '    <label class="field-label" for="stealth-url">Target URL</label>' +
          '    <input type="url" id="stealth-url" class="input" placeholder="https://example.com" />' +
          "  </div>" +
          '  <button type="button" class="btn btn--primary btn--block" id="stealth-open">Open stealth window</button>' +
          '  <p class="form-note" style="margin-top:14px">' +
          "    Opens a blank window with the page embedded, so the address bar stays empty. Allow pop-ups for this site." +
          "  </p>" +
          "</div>"
      };

      /* ---------------------------------------------------- 1. calculator */

      /* A tiny recursive-descent parser. The previous version used eval(),
         which will happily run anything a visitor pastes into the display. */
      function evaluate(source) {
        var expr = String(source);
        var i = 0;

        function skip() {
          while (expr.charAt(i) === " ") i++;
        }

        function primary() {
          skip();
          var ch = expr.charAt(i);
          if (ch === "(") {
            i++;
            var inner = sum();
            skip();
            if (expr.charAt(i) !== ")") throw new Error("Unbalanced brackets");
            i++;
            return inner;
          }
          if (ch === "-") {
            i++;
            return -primary();
          }
          if (ch === "+") {
            i++;
            return primary();
          }
          var start = i;
          while (i < expr.length && "0123456789.".indexOf(expr.charAt(i)) !== -1) i++;
          if (start === i) throw new Error("Unexpected character");
          var value = parseFloat(expr.slice(start, i));
          if (isNaN(value)) throw new Error("Not a number");
          return value;
        }

        function product() {
          var value = primary();
          for (;;) {
            skip();
            var ch = expr.charAt(i);
            if (ch === "*") {
              i++;
              value *= primary();
            } else if (ch === "/") {
              i++;
              var divisor = primary();
              if (divisor === 0) throw new Error("Divide by zero");
              value /= divisor;
            } else {
              return value;
            }
          }
        }

        function sum() {
          var value = product();
          for (;;) {
            skip();
            var ch = expr.charAt(i);
            if (ch === "+") {
              i++;
              value += product();
            } else if (ch === "-") {
              i++;
              value -= product();
            } else {
              return value;
            }
          }
        }

        var result = sum();
        skip();
        if (i < expr.length) throw new Error("Unexpected character");
        if (!isFinite(result)) throw new Error("Out of range");
        /* Trim binary floating-point noise: 0.1 + 0.2 should read 0.3. */
        return parseFloat(result.toPrecision(12));
      }

      function initCalculator() {
        var display = document.getElementById("calc-display");
        var keypad = document.getElementById("calc-keys");
        var expression = "";
        var isResult = false;

        var KEYS = [
          { label: "C", action: "clear", variant: "btn--danger" },
          /* "DEL" rather than ⌫ — the glyph is missing from some font stacks
             and renders as a hollow box. */
          { label: "DEL", action: "back", aria: "Backspace" },
          { label: "(", value: "(" },
          { label: ")", value: ")" },
          { label: "7", value: "7" },
          { label: "8", value: "8" },
          { label: "9", value: "9" },
          { label: "÷", value: "/", aria: "Divide" },
          { label: "4", value: "4" },
          { label: "5", value: "5" },
          { label: "6", value: "6" },
          { label: "×", value: "*", aria: "Multiply" },
          { label: "1", value: "1" },
          { label: "2", value: "2" },
          { label: "3", value: "3" },
          { label: "−", value: "-", aria: "Minus" },
          { label: "0", value: "0" },
          { label: ".", value: "." },
          { label: "+", value: "+", aria: "Plus" },
          { label: "=", action: "equals", variant: "btn--primary" }
        ];

        function render() {
          display.textContent = expression === "" ? "0" : expression;
          display.scrollLeft = display.scrollWidth;
        }

        function push(value) {
          if (isResult && "0123456789.".indexOf(value) !== -1) expression = "";
          isResult = false;
          expression += value;
          render();
        }

        function equals() {
          if (expression === "") return;
          try {
            expression = String(evaluate(expression));
            isResult = true;
          } catch (err) {
            display.textContent = err.message;
            expression = "";
            isResult = false;
            return;
          }
          render();
        }

        function run(key) {
          if (key.action === "clear") {
            expression = "";
            isResult = false;
            render();
          } else if (key.action === "back") {
            expression = expression.slice(0, -1);
            isResult = false;
            render();
          } else if (key.action === "equals") {
            equals();
          } else {
            push(key.value);
          }
        }

        KEYS.forEach(function (key) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn " + (key.variant || "");
          btn.textContent = key.label;
          if (key.aria) btn.setAttribute("aria-label", key.aria);
          btn.addEventListener("click", function () {
            run(key);
          });
          keypad.appendChild(btn);
        });

        /* Keyboard support — a calculator you can only click is half a tool. */
        function onKey(e) {
          if (activeTool !== "calculator") return;
          if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;

          if ("0123456789.+-*/()".indexOf(e.key) !== -1 && e.key.length === 1) {
            push(e.key);
          } else if (e.key === "Enter" || e.key === "=") {
            e.preventDefault();
            equals();
          } else if (e.key === "Backspace") {
            e.preventDefault();
            expression = expression.slice(0, -1);
            render();
          } else if (e.key === "Escape") {
            expression = "";
            render();
          }
        }

        document.addEventListener("keydown", onKey);
        teardown.push(function () {
          document.removeEventListener("keydown", onKey);
        });

        render();
      }

      /* ------------------------------------------------------- 2. notepad */

      function initNotepad() {
        var textarea = document.getElementById("notepad");
        var saveBtn = document.getElementById("note-save");
        var count = document.getElementById("note-count");
        var timer = null;

        /* `astra_notepad` was the old key — read it once so existing notes
           survive the rename. */
        textarea.value =
          localStorage.getItem(Astra.storeKeys.notepad) || localStorage.getItem("astra_notepad") || "";

        function updateCount() {
          var n = textarea.value.length;
          count.textContent = n + (n === 1 ? " character" : " characters");
        }

        function save(announce) {
          try {
            localStorage.setItem(Astra.storeKeys.notepad, textarea.value);
            if (announce) Astra.toast("Notes saved");
          } catch (e) {
            Astra.toast("Could not save — storage is unavailable");
          }
        }

        /* Autosave so a closed tab never loses work; the button is for peace of mind. */
        textarea.addEventListener("input", function () {
          updateCount();
          clearTimeout(timer);
          timer = setTimeout(function () {
            save(false);
          }, 600);
        });

        saveBtn.addEventListener("click", function () {
          clearTimeout(timer);
          save(true);
        });

        teardown.push(function () {
          clearTimeout(timer);
          save(false);
        });

        updateCount();
      }

      /* ----------------------------------------------------- 3. converter */

      /* Everything except temperature converts through a base unit. */
      var UNITS = {
        length: {
          Millimetre: 0.001,
          Centimetre: 0.01,
          Metre: 1,
          Kilometre: 1000,
          Inch: 0.0254,
          Foot: 0.3048,
          Yard: 0.9144,
          Mile: 1609.344
        },
        mass: {
          Gram: 0.001,
          Kilogram: 1,
          Tonne: 1000,
          Ounce: 0.028349523125,
          Pound: 0.45359237,
          Stone: 6.35029318
        },
        data: {
          Bit: 0.125,
          Byte: 1,
          Kilobyte: 1024,
          Megabyte: 1048576,
          Gigabyte: 1073741824,
          Terabyte: 1099511627776
        },
        temperature: { Celsius: 1, Fahrenheit: 1, Kelvin: 1 }
      };

      function toCelsius(value, unit) {
        if (unit === "Fahrenheit") return (value - 32) * (5 / 9);
        if (unit === "Kelvin") return value - 273.15;
        return value;
      }

      function fromCelsius(value, unit) {
        if (unit === "Fahrenheit") return value * (9 / 5) + 32;
        if (unit === "Kelvin") return value + 273.15;
        return value;
      }

      function initConverter() {
        var type = document.getElementById("conv-type");
        var from = document.getElementById("conv-from");
        var to = document.getElementById("conv-to");
        var value = document.getElementById("conv-value");
        var result = document.getElementById("conv-result");

        function populate() {
          var names = Object.keys(UNITS[type.value]);
          from.innerHTML = "";
          to.innerHTML = "";
          names.forEach(function (name) {
            from.add(new Option(name, name));
            to.add(new Option(name, name));
          });
          from.selectedIndex = 0;
          to.selectedIndex = Math.min(1, names.length - 1);
        }

        function format(n) {
          if (!isFinite(n)) return "—";
          var rounded = parseFloat(n.toPrecision(10));
          return Math.abs(rounded) >= 1e9 || (Math.abs(rounded) < 1e-6 && rounded !== 0)
            ? rounded.toExponential(4)
            : rounded.toLocaleString(undefined, { maximumFractionDigits: 6 });
        }

        function update() {
          var input = parseFloat(value.value);
          if (isNaN(input)) {
            result.textContent = "";
            return;
          }
          var out;
          if (type.value === "temperature") {
            out = fromCelsius(toCelsius(input, from.value), to.value);
          } else {
            out = (input * UNITS[type.value][from.value]) / UNITS[type.value][to.value];
          }
          result.textContent = format(out) + " " + to.value;
        }

        type.addEventListener("change", function () {
          populate();
          update();
        });
        [from, to].forEach(function (el) {
          el.addEventListener("change", update);
        });
        value.addEventListener("input", update);

        populate();
        update();
      }

      /* ------------------------------------------------------- 4. cloaker */

      function initCloaker() {
        var title = document.getElementById("cloak-title");
        var favicon = document.getElementById("cloak-favicon");

        document.getElementById("cloak-apply").addEventListener("click", function () {
          if (!title.value.trim() && !favicon.value.trim()) {
            Astra.toast("Enter a title or a favicon URL first");
            return;
          }
          Astra.cloak({ title: title.value.trim(), favicon: favicon.value.trim() });
          Astra.toast("Cloak applied");
        });

        document.getElementById("cloak-reset").addEventListener("click", function () {
          title.value = "";
          favicon.value = "";
          Astra.cloak("reset");
        });
      }

      /* ------------------------------------------------- 5. stealth window */

      function initStealth() {
        var input = document.getElementById("stealth-url");

        function open() {
          var raw = input.value.trim();
          if (!raw) {
            Astra.toast("Enter a URL first");
            return;
          }
          if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;

          var target;
          try {
            target = new URL(raw);
          } catch (e) {
            Astra.toast("That does not look like a valid URL");
            return;
          }
          if (target.protocol !== "http:" && target.protocol !== "https:") {
            Astra.toast("Only http and https addresses are allowed");
            return;
          }

          var win = window.open("about:blank");
          if (!win) {
            Astra.toast("Pop-up blocked — allow pop-ups for this site");
            return;
          }

          /* Built with DOM calls rather than document.write so the URL can
             never break out of the markup. */
          var doc = win.document;
          doc.title = document.title;
          doc.body.style.margin = "0";
          doc.body.style.background = "#000";
          var frame = doc.createElement("iframe");
          frame.style.cssText = "border:0;display:block;width:100vw;height:100vh";
          frame.src = target.href;
          doc.body.appendChild(frame);
        }

        document.getElementById("stealth-open").addEventListener("click", open);
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") open();
        });
      }

      var initialisers = {
        calculator: initCalculator,
        notepad: initNotepad,
        converter: initConverter,
        cloaker: initCloaker,
        stealth: initStealth
      };

      /* ------------------------------------------------------- switching */

      function show(tool) {
        if (!templates[tool]) return;

        teardown.forEach(function (fn) {
          fn();
        });
        teardown = [];

        panel.classList.remove("is-shown");

        setTimeout(function () {
          panel.innerHTML = templates[tool];
          activeTool = tool;

          tabs.forEach(function (tab) {
            tab.setAttribute("aria-selected", String(tab.id === "tab-" + tool));
          });

          initialisers[tool]();
          requestAnimationFrame(function () {
            panel.classList.add("is-shown");
          });
        }, Astra.prefersReducedMotion() ? 0 : 260);
      }

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          var tool = tab.id.replace("tab-", "");
          if (tool !== activeTool) show(tool);
        });
      });

      /* Deep-link support: tools.html#notepad opens straight into the notepad. */
      var requested = window.location.hash.replace("#", "");
      Astra.ready(function () {
        show(templates[requested] ? requested : "calculator");
      });
    })();
  </script>
</body>
</html>
