<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astra – Games</title>
  <meta name="description" content="Play the Astra games library in a frosted-glass window." />
  <meta name="theme-color" content="#0f111a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:site_name" content="Astra" />
  <meta property="og:title" content="Astra – Games" />
  <meta property="og:description" content="Play the Astra games library in a frosted-glass window." />
  <meta property="og:type" content="website" />

  <script>
    (function (d) {
      var r = d.documentElement;
      r.classList.remove("no-js");
      r.classList.add("js");
      try {
        r.setAttribute("data-theme", localStorage.getItem("astra-theme") === "light" ? "light" : "dark");
      } catch (e) {}
    })(document);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-layout="scroll">

  <a class="skip-link" href="#main">Skip to content</a>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div data-astra-nav-mount></div>

  <main class="page" id="main">
    <h1 class="page-title">Games</h1>
    <p class="page-lead">
      Games open in a frosted window on top of Astra. If one refuses to load, use
      <strong>Open in new tab</strong> in the window bar.
    </p>

    <div class="tile-grid" id="game-grid"></div>

    <p class="panic-hint">Press <span class="kbd">]</span> to leave instantly.</p>
  </main>

  <script src="astra.js"></script>
  <script>
    /* The games library lives on its own GitHub Pages site. Each tile opens the
       hub; swap in a per-game deep link as `url` when one is available. */
    var GAMES_HUB = "https://ethandupe.github.io/games-main/";

    var GAMES = [
      { label: "All Games", url: GAMES_HUB, glyph: "★" },
      { label: "Among Us", url: GAMES_HUB },
      { label: "Slope", url: GAMES_HUB },
      { label: "Vex 5", url: GAMES_HUB },
      { label: "Run 3", url: GAMES_HUB },
      { label: "Retro Bowl", url: GAMES_HUB }
    ];

    Astra.ready(function () {
      Astra.mountTiles(document.getElementById("game-grid"), GAMES);
    });
  </script>
</body>
</html>
