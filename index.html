<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <meta property="og:site_name" content="Astra" />
  <meta property="og:title" content="Astra" />

  <meta property="og:type" content="website" />

  <!-- Boot snippet: applies the saved theme before first paint so there is no
       flash of the wrong colour scheme. Identical on every page. -->
  <script>
    (function (d) {
      var r = d.documentElement;
      r.classList.remove("no-js");
      r.classList.add("js");
      try {
        r.setAttribute("data-theme", localStorage.getItem("astra-theme") === "light" ? "light" : "dark");
      } catch (e) {}
    })(document);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
