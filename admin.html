<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astra – Admin</title>
  <meta name="description" content="Astra broadcast console." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f111a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <script>
    (function (d) {
      var r = d.documentElement;
      r.classList.remove("no-js");
      r.classList.add("js");
      try {
        r.setAttribute("data-theme", localStorage.getItem("astra-theme") === "light" ? "light" : "dark");
      } catch (e) {}
    })(document);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .admin-card {
      width: min(520px, calc(100vw - 32px));
      text-align: center;
    }

    .admin-card h1 {
      margin: 0 0 6px;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: var(--header-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-card > p {
      margin: 0 0 24px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .current-broadcast {
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid var(--glass-hairline);
      border-radius: var(--r-sm);
      background: var(--field-bg);
      text-align: left;
      font-size: 0.92rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .current-broadcast strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<!-- Broadcasts are muted here so the console does not toast its own messages. -->
<body data-layout="center" data-astra-broadcast="off">

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div data-astra-nav-mount></div>

  <main>
    <!-- Gate -->
    <section class="glass-panel admin-card" id="gate">
      <h1>Restricted</h1>
      <p>Enter the administrator passcode.</p>

      <label class="field-label" for="passcode">Passcode</label>
      <input type="password" id="passcode" class="input" placeholder="••••••••" autocomplete="current-password" />

      <button type="button" class="btn btn--primary btn--block" id="unlock" style="margin-top:16px">Unlock</button>
      <p class="status-msg status-msg--error" id="gate-error">Access denied.</p>
    </section>

    <!-- Console -->
    <section class="glass-panel admin-card" id="console" hidden>
      <h1>Broadcast</h1>
      <p>Pushes a notification to everyone browsing Astra.</p>

      <div class="current-broadcast" id="current">
        <strong>Currently live</strong>
        <span id="current-text">Checking…</span>
      </div>

      <label class="field-label" for="message">Message</label>
      <textarea id="message" class="textarea" style="min-height:110px" placeholder="Type your message here…"></textarea>

      <button type="button" class="btn btn--primary btn--block" id="send" style="margin-top:12px">Push notification</button>
      <button type="button" class="btn btn--danger btn--block" id="clear" style="margin-top:10px">Clear current broadcast</button>

      <p class="status-msg" id="status"></p>
    </section>
  </main>

  <script src="astra.js"></script>
  <script>
    (function () {
      /* SECURITY NOTE — read before relying on this page.
         This is a static site, so both the passcode and the jsonbin key below
         are visible to anyone who views source. The gate is a speed bump, not
         access control, and the key can write to the bin. See README.md. */
      var PASSCODE = "superbut76";
      var BIN = "https://api.jsonbin.io/v3/b/" + Astra.config.broadcastBin;
      var KEY = Astra.config.broadcastKey;

      var gate = document.getElementById("gate");
      var consolePanel = document.getElementById("console");
      var passcode = document.getElementById("passcode");
      var gateError = document.getElementById("gate-error");
      var status = document.getElementById("status");
      var currentText = document.getElementById("current-text");
      var message = document.getElementById("message");

      function say(text, isError) {
        status.textContent = text;
        status.classList.toggle("status-msg--error", !!isError);
        status.classList.add("is-visible");
        setTimeout(function () {
          status.classList.remove("is-visible");
        }, 3000);
      }

      function unlock() {
        if (passcode.value !== PASSCODE) {
          gateError.classList.add("is-visible");
          passcode.value = "";
          passcode.focus();
          return;
        }
        gate.hidden = true;
        consolePanel.hidden = false;
        message.focus();
        refresh();
      }

      function refresh() {
        fetch(BIN + "/latest?meta=false&t=" + Date.now(), {
          cache: "no-store",
          headers: { "X-Master-Key": KEY }
        })
          .then(function (response) {
            if (!response.ok) throw new Error(String(response.status));
            return response.json();
          })
          .then(function (data) {
            var live = data && typeof data.message === "string" ? data.message.trim() : "";
            currentText.textContent = !live || live === "null" ? "Nothing is being broadcast." : live;
          })
          .catch(function () {
            currentText.textContent = "Could not read the current broadcast.";
          });
      }

      function push(payload, successText) {
        fetch(BIN, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": KEY },
          body: JSON.stringify({ message: payload })
        })
          .then(function (response) {
            if (!response.ok) throw new Error(String(response.status));
            say(successText);
            refresh();
          })
          .catch(function (error) {
            say("Push failed (" + error.message + ").", true);
          });
      }

      document.getElementById("unlock").addEventListener("click", unlock);
      passcode.addEventListener("keydown", function (e) {
        if (e.key === "Enter") unlock();
      });
      passcode.addEventListener("input", function () {
        gateError.classList.remove("is-visible");
      });

      document.getElementById("send").addEventListener("click", function () {
        var text = message.value.trim();
        if (!text) {
          say("Cannot send an empty message.", true);
          return;
        }
        push(text, "Broadcast sent.");
        message.value = "";
      });

      document.getElementById("clear").addEventListener("click", function () {
        push("null", "Broadcast cleared.");
      });
    })();
  </script>
</body>
</html>
