<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astra – Apps</title>
  <meta name="description" content="Open the web apps you need in a frosted-glass window, without leaving Astra." />
  <meta name="theme-color" content="#0f111a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:site_name" content="Astra" />
  <meta property="og:title" content="Astra – Apps" />
  <meta property="og:description" content="Open the web apps you need in a frosted-glass window." />
  <meta property="og:type" content="website" />

  <script>
    (function (d) {
      var r = d.documentElement;
      r.classList.remove("no-js");
      r.classList.add("js");
      try {
        r.setAttribute("data-theme", localStorage.getItem("astra-theme") === "light" ? "light" : "dark");
      } catch (e) {}
    })(document);
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-layout="scroll">

  <a class="skip-link" href="#main">Skip to content</a>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div data-astra-nav-mount></div>

  <main class="page" id="main">
    <h1 class="page-title">Apps</h1>
    <p class="page-lead">
      Everything opens in a frosted window on top of Astra. Cloak the tab first if you need to.
    </p>

    <div class="segmented" aria-label="Tab cloak">
      <button type="button" data-cloak="drive">Drive</button>
      <button type="button" data-cloak="classroom">Classroom</button>
      <button type="button" data-cloak="docs">Docs</button>
      <button type="button" data-cloak="reset">Reset</button>
    </div>

    <p class="panic-hint" style="margin-bottom: 2.5rem">
      The cloak follows you across pages. Press <span class="kbd">]</span> to leave instantly.
    </p>

    <div class="tile-grid" id="app-grid"></div>
  </main>

  <script src="astra.js"></script>
  <script>
    /* App catalogue — edit this list to change the grid.
       Icons come from Simple Icons so every tile shares one flat, single-colour
       style instead of mixing logos from four different sources.
       `external: true` is for sites that refuse to be framed, so they open in a
       new tab instead of showing an empty window. */
    var APPS = [
      {
        label: "Browser",
        url: "https://scramjet.mercurywork.shop/scramjet/https%3A%2F%2Fwww.google.com%2F",
        icon: "https://cdn.simpleicons.org/google/4285F4"
      },
      {
        label: "YouTube",
        url: "https://scramjet.mercurywork.shop/scramjet/https%3A%2F%2Fwww.youtube.com%2F",
        icon: "https://cdn.simpleicons.org/youtube/FF0000"
      },
      {
        label: "Discord",
        url: "https://scramjet.mercurywork.shop/scramjet/https%3A%2F%2Fdiscord.com%2F",
        icon: "https://cdn.simpleicons.org/discord/5865F2"
      },
      {
        label: "TikTok",
        url: "https://scramjet.mercurywork.shop/scramjet/https%3A%2F%2Fwww.tiktok.com%2Fexplore",
        icon: "https://cdn.simpleicons.org/tiktok/EE1D52"
      },
      {
        /* Not published by Simple Icons, so this one stays on Wikimedia. */
        label: "ChatGPT",
        url: "https://scramjet.mercurywork.shop/scramjet/https%3A%2F%2Fchatgpt.com%2F",
        icon: "https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg"
      },
      {
        label: "Spotify",
        url: "https://open.spotify.com",
        icon: "https://cdn.simpleicons.org/spotify/1DB954",
        external: true
      }
    ];

    Astra.ready(function () {
      Astra.mountTiles(document.getElementById("app-grid"), APPS);

      document.querySelectorAll("[data-cloak]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          Astra.cloak(btn.getAttribute("data-cloak"));
        });
      });
    });
  </script>
</body>
</html>
